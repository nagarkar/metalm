# Copy to ops.toml in the main metalm checkout (read through ~/.claude/metalm/ops.toml).
# ops.toml is gitignored: it names this machine's databases, ports and agents.
# How to find the databases to list: the metalm skill, section "Finding databases".

label_prefix = "com.example"     # launch agents become <prefix>.metalm.backup and <prefix>.metalm.ops.serve
port = 8700                      # the dashboard's loopback port; tailscale serve fronts it

[backup]
local_dir = "~/Backups/lm"       # internal disk; one folder per nightly run
keep_local = 7                   # (owner) last 7 runs
b2_bucket = "example-bucket"     # Backblaze B2 bucket; keys come from the keychain
restic_path = "metalm"           # folder in the bucket holding the restic repository
keep_daily = 7                   # (owner) B2 retention: 7 daily, 4 weekly, 12 monthly
keep_weekly = 4
keep_monthly = 12
check_subset = "5%"              # (owner) weekly restic check reads this share of the data

[[database]]
repo = "examplelm"
name = "store"
path = "/Volumes/Example/examplelm/store.sqlite"

[[repo]]
name = "examplelm"
path = "~/workspace/repos/examplelm"
github = "owner/examplelm"
ports = [8700]                   # loopback ports of its served apps that answer /health (served-apps table); omit if none
agents = ["com.example.examplelm.serve"]

# Auto-improve is off when this table is absent. The example opts in these two repos.
[[repo]]
name = "computerlm"
path = "~/workspace/repos/computerlm"
github = "owner/computerlm"

[[repo]]
name = "marketlm"
path = "~/workspace/repos/marketlm"
github = "owner/marketlm"

[improve]
slots = ["09:10", "13:10", "17:10", "21:10"] # 1–8 increasing local times; never wakes the Mac
max_lateness_min = 60          # skip a slot caught up late after sleep
lines_per_run = 400            # positive; activity runs = ceil(demand / this), capped by slots
decay = [1.0, 1.0, 0.75, 0.5, 0.5, 0.25, 0.25] # changed-line weights: today through six days ago
enabled = true                 # kill switch; <state_dir>/improve/PAUSE also stops every run
codex_bin = "/Applications/ChatGPT.app/Contents/Resources/codex-cli/bin/codex"
model = "gpt-6-astra"
effort = "high"
max_codex_calls_per_day = 20
claude_bin = "~/.local/bin/claude"
review_model = "claude-opus-5-5"
max_review_cost_usd_per_day = 2.00
propose_timeout_min = 20
review_timeout_min = 8
ci_timeout_min = 15
max_files = 5
max_changed_lines = 150

[[improve.repo]]
name = "computerlm"            # path and github come from its [[repo]] row
test = "{venv}/bin/pytest -q"  # {venv} is the repo's .venv; {worktree} is the isolated worktree
merge = "merge"                # merge | squash | rebase
exclude = []                   # additional fnmatch-style globs
# Optional subset; omit for every applicable lens. An empty list disables all lenses.
lenses = ["readability", "documentation", "duplication", "tests", "backend-robustness", "frontend-robustness", "ui", "performance", "drift"]
# deploy = "launchctl kickstart -k gui/$(id -u)/com.example.computerlm.serve"

[[improve.repo]]
name = "marketlm"
test = "{venv}/bin/pytest -q"
merge = "merge"
