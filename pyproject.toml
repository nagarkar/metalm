[project]
name = "metalm-gendocs"
version = "0.1.0"
description = "Generates docs/generated/ (areas, owner decisions, glossary, CUJs) from a repo's docstrings and test markers."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
metalm-gendocs = "metalm_gendocs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
