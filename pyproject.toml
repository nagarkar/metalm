[project]
name = "metalm-gendocs"
version = "0.1.0"
description = "Generates docs/generated/ (areas, owner decisions, glossary, CUJs) from a repo's docstrings and test markers."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.6.9", "pre-commit>=3"]
brand = ["Pillow>=10"]  # tools/notifier/make_brand.py

[project.scripts]
metalm-gendocs = "metalm_gendocs.cli:main"
metalm-ops = "metalm_ops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metalm_ops = ["assets/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/jev-decision/tests"]
markers = ["cuj(journey): an end-to-end test that proves a critical user journey"]

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["tools/notifier/build"]
